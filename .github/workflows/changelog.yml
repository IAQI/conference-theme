# Fails a pull request that changes what sites get (layouts, styles, scripts,
# ...) without a line in CHANGELOG.md. A maintainer can skip it with the
# "no changelog" label for changes sites don't see. See CHANGELOG.md.
name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md updated?
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "$changed"
          if ! echo "$changed" | grep -qE '^(layouts|assets|i18n|archetypes|data|scripts|static)/|^hugo\.toml$'; then
            echo "Nothing that sites get has changed; no changelog entry needed."
            exit 0
          fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is updated."
            exit 0
          fi
          echo "::error file=CHANGELOG.md::This pull request changes what sites get but not CHANGELOG.md. Add a line under '## Unreleased' (see the top of CHANGELOG.md), or ask a maintainer for the 'no changelog' label."
          exit 1
